services:
  frontend:
    build:
      context: ./new-frontend
      dockerfile: Dockerfile.frontend
    container_name: mednexus-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8787/api
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - mednexus-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mednexus-backend
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=mednexus
      - DB_PASSWORD=mednexus
      - DB_NAME=mednexus_local
      - REDIS_URL=redis://redis:6379
      - LM_STUDIO_URL=http://host.docker.internal:1234/v1
      - OSCE_AI_MODEL=qwen3-8b
      - OSCE_TEXT_MODEL=qwen3-8b
      - LOCAL_AI_TIMEOUT_MS=30000
      - JWT_SECRET=${JWT_SECRET:-super-secret-key-change-in-production}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY:-admin-key-change-in-production}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - mednexus-network

  postgres:
    image: postgres:16-alpine
    container_name: mednexus-postgres
    environment:
      POSTGRES_USER: mednexus
      POSTGRES_PASSWORD: mednexus
      POSTGRES_DB: mednexus_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - mednexus-network

  redis:
    image: redis:7-alpine
    container_name: mednexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - mednexus-network

  # NOTE: lm-studio and qdrant services are not included because:
  # - lm-studio image (ghcr.io/lm-studio-ai/lm-studio:latest) requires authentication
  # - qdrant image (quay.io/qdrant/qdrant:v1.9.0) may have access restrictions
  # 
  # For local AI, run LM Studio locally and expose via ngrok:
  #   npm run tunnel
  #
  # For the recommended Cloudflare Workers setup, run:
  #   npm run dev

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: mednexus-worker
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=mednexus
      - DB_PASSWORD=mednexus
      - DB_NAME=mednexus_local
      - REDIS_URL=redis://redis:6379
      - LM_STUDIO_URL=http://host.docker.internal:1234/v1
      - OSCE_AI_MODEL=qwen3-8b
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - mednexus-network
    profiles:
      - worker

  nginx:
    image: nginx:alpine
    container_name: mednexus-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - mednexus-network

volumes:
  postgres_data:
  redis_data:

networks:
  mednexus-network:
    driver: bridge