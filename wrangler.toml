name = "mednexus-cloudflare"
main = "src/worker.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]

# Serve the built SPA from the same origin as the API.
assets = { directory = "./public", binding = "ASSETS", not_found_handling = "single-page-application" }

# D1 SQLite database
[[d1_databases]]
binding = "DB"
database_name = "mednexus-db"
database_id = "278eb472-eda7-4231-8243-e9946b589e2a"
migrations_dir = "migrations"

# Non-secret configuration (safe to commit)
[vars]
NODE_ENV = "production"
FREE_MAX_DECKS = "100"
FREE_MAX_CARDS_PER_DECK = "200"
APP_URL = "https://mednexus.fit"
# LOCAL_AI_URL: Cloudflare tunnel URL for production
# Points to LM Studio at 192.168.100.205:1234 via tunnel
LOCAL_AI_URL = "https://ai.mednexus.fit/v1"
AI_TEXT_MODEL = "local/qwen/qwen3-vl-4b"
AI_VISION_MODEL = "local/qwen/qwen3-vl-4b"
AI_QBANK_MODEL = "local/qwen/qwen3-vl-4b"
AI_EXPLAIN_MODEL = "local/qwen/qwen3-vl-4b"
STUDY_BUDDY_MODEL = "local/qwen/qwen3-vl-4b"
GOOGLE_CLIENT_ID = "911372032508-7oi1o2s1o76c3uhiajj9eiuong17ulr3.apps.googleusercontent.com"

routes = [
  { pattern = "mednexus.fit", zone_name = "mednexus.fit" },
  { pattern = "api.mednexus.fit", zone_name = "mednexus.fit" }
]

# Local LM Studio server (OpenAI-compatible /v1 API) on the LAN. No API key required.
# This host reaches LM Studio directly at 192.168.100.205:1234 (verified working).
# Use this for LOCAL `wrangler dev`. For the deployed worker on Cloudflare's edge,
# run `npm run tunnel` (named tunnel) — see scripts/tunnel.mjs. The named-tunnel
# token lives in .tunnel-state.json (tunnel "mednexus"):
#   cloudflared login
#   cloudflared tunnel token mednexus   # paste output into .tunnel-state.json "token"
# Card generation tuning (optional). Concurrency = chunks generated in parallel.
# There is intentionally NO overall deadline: generation runs until the model
# finishes every chunk (it is unbounded by wall-clock). Only a client disconnect
# aborts in-flight calls. Set GEN_CONCURRENCY higher for fast hosted providers.
GEN_CONCURRENCY = "4"

# Secrets are set via: wrangler secret put <NAME>
#   OPENROUTER_API_KEY, OPENAI_API_KEY, GROQ_API_KEY, OLLAMA_CLOUD_API_KEY,
#   GOOGLE_CLIENT_ID, ADMIN_SECRET_KEY, APP_URL
